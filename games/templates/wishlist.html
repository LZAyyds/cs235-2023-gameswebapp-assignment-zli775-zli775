<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wishlist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
</head>
<body>
{% include 'navbar.html' %}

<div id="content">
    <div id="header">
        <h1>My Wishlist</h1>
        <h6 id="contentAuthorName">©️Your Name</h6>
    </div>

    <div id="about-container">
        {% for game in wishlist %}
            <div class="game-display">
                <p class="gameName">{{ game.title }}</p>
                <a href="{{ url_for('game_description_bp.game_description', title=game.title) }}">
                    <img src="{{ game.image_url }}">
                </a>
                <a href="{{ url_for('wishlist.remove', game_title=game.title) }}" class="remove-button">Remove from Wishlist</a>
            </div>
        {% endfor %}
    </div>

</div>

{% include 'loginstatus.html' %}

</body>
</html>
